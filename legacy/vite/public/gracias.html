<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://dianaloscoscoach.com/" />
    <title>Mensaje enviado correctamente | Diana Loscos Coaching</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      .wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
      }
      .card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        max-width: 560px;
        width: 100%;
        padding: 36px;
        text-align: center;
      }
      h1 {
        font-family: "Georgia", "Times New Roman", serif;
        font-size: 32px;
        margin: 0 0 12px;
      }
      p {
        margin: 0 0 24px;
        font-size: 18px;
        color: #334155;
      }
      a.btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 24px;
        border-radius: 999px;
        background: #0f766e;
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
        transition: background 0.2s ease;
      }
      a.btn:hover {
        background: #0d5f59;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Mensaje enviado correctamente</h1>
        <p>He recibido tu solicitud y me pondré en contacto contigo lo antes posible.</p>
        <a class="btn" href="https://dianaloscoscoach.com/">Volver al inicio</a>
      </div>
    </div>
  </body>
</html>
