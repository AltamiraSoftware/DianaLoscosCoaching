[build]
  command = "npm run build"
  publish = ".next"
[build.environment]
  NODE_VERSION = "22"
# Netlify detects Next.js and installs its current OpenNext adapter automatically.
[context.deploy-preview.environment]
  SITE_NOINDEX = "true"
[context.branch-deploy.environment]
  SITE_NOINDEX = "true"
